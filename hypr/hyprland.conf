# ┌──────────────────────────────────────────┐
# │  Hyprland Configuration        │
# │  Modular config - sources below          │
# └──────────────────────────────────────────┘

source = ./theme.conf
source = ./keybinds.conf
source = ./rules.conf
source = ./autostart.conf

# ── Monitor ──────────────────────────────────
# Default: auto-detect. Override per-machine.
monitor = , preferred, auto, 1

# ── Input ────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ── General ──────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
    allow_tearing = false
}

# ── Decoration ───────────────────────────────
decoration {
    rounding = 8

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
    }
}

# ── Animations ───────────────────────────────
animations {
    enabled = true

    bezier = snappy, 0.05, 0.9, 0.1, 1.0

    animation = windows, 1, 4, snappy
    animation = windowsOut, 1, 4, snappy, popin 80%
    animation = fade, 1, 3, snappy
    animation = workspaces, 1, 4, snappy, slide
    animation = border, 1, 4, snappy
}

# ── Layout ───────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
}

# ── Misc ─────────────────────────────────────
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
