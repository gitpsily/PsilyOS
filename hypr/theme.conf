# ┌──────────────────────────────────────────┐
# │  Theme (wallust generated)     │
# │  This file gets overwritten by wallust   │
# │  Edit the template, not this file        │
# └──────────────────────────────────────────┘

# Fallback colors (Tokyo Night) — wallust replaces these
$bg       = rgb(1a1b26)
$fg       = rgb(c0caf5)
$accent   = rgb(7aa2f7)
$accent2  = rgb(bb9af7)
$warn     = rgb(e0af68)
$err      = rgb(f7768e)
$surface  = rgb(24283b)
$overlay  = rgb(414868)
$subtle   = rgb(565f89)
$muted    = rgb(3b4261)

general {
    col.active_border = $accent $accent2 45deg
    col.inactive_border = $muted
}

decoration {
    shadow {
        color = rgba(1a1b2688)
    }
}
