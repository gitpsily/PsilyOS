# ┌──────────────────────────────────────────┐
# │  Window Rules                             │
# └──────────────────────────────────────────┘

# ── Float Rules ──────────────────────────────
windowrule = match:class pavucontrol, float on, size 800 600
windowrule = match:class nm-connection-editor, float on
windowrule = match:class blueman-manager, float on, size 800 600
windowrule = match:class org.gnome.Calculator, float on
windowrule = match:title Picture-in-Picture, float on

# ── Opacity ──────────────────────────────────
windowrule = match:class ghostty, opacity 0.92
windowrule = match:class kitty, opacity 0.92
windowrule = match:class foot, opacity 0.92
windowrule = match:class thunar, opacity 0.95
