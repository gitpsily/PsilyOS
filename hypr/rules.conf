# ┌──────────────────────────────────────────┐
# │  Window Rules                  │
# └──────────────────────────────────────────┘

# ── Float Rules ──────────────────────────────
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(thunar)$, title:^(File Operation Progress)$
windowrule = float, class:^(org.gnome.Calculator)$
windowrule = float, title:^(Picture-in-Picture)$

# ── Size Rules ───────────────────────────────
windowrule = size 800 600, class:^(pavucontrol)$
windowrule = size 800 600, class:^(blueman-manager)$

# ── Workspace Assignments ────────────────────
# windowrule = workspace 2 silent, class:^(chromium)$
# windowrule = workspace 9 silent, class:^(Spotify)$

# ── Opacity ──────────────────────────────────
windowrule = opacity 0.92, class:^(ghostty)$
windowrule = opacity 0.92, class:^(kitty)$
windowrule = opacity 0.95, class:^(thunar)$
