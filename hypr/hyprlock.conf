# ┌──────────────────────────────────────────┐
# │  Hyprlock Configuration        │
# │  Colors injected by wallust template     │
# └──────────────────────────────────────────┘

background {
    path = screenshot
    blur_passes = 3
    blur_size = 6
}

input-field {
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(7aa2f7)
    inner_color = rgb(24283b)
    font_color = rgb(c0caf5)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 8
    position = 0, -50
    halign = center
    valign = center
}

label {
    text = $TIME
    color = rgb(c0caf5)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    text = cmd[update:3600000] date +"%A, %B %d"
    color = rgb(565f89)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
