# ┌──────────────────────────────────────────┐
# │  Wallust Configuration (v3)              │
# │  Dynamic color generation from wallpaper │
# └──────────────────────────────────────────┘

backend = "kmeans"
color_space = "labmixed"
threshold = 20
palette = "harddark16"
check_contrast = true
saturation = 60

[templates]
hyprland = { template = "hyprland.conf", target = "~/.config/hypr/theme.conf" }
waybar   = { template = "waybar.css",    target = "~/.config/waybar/style.css" }
mako     = { template = "mako.conf",     target = "~/.config/mako/config" }
rofi     = { template = "rofi.rasi",     target = "~/.config/rofi/theme.rasi" }
ghostty  = { template = "ghostty.conf",  target = "~/.config/ghostty/config" }
hyprlock = { template = "hyprlock.conf", target = "~/.config/hypr/hyprlock.conf" }
tmux     = { template = "tmux.conf",     target = "~/.config/tmux/tmux.conf" }
foot     = { template = "foot.ini",      target = "~/.config/foot/foot.ini" }
wlogout  = { template = "wlogout.css",   target = "~/.config/wlogout/style.css" }
