# ┌──────────────────────────────────────────┐
# │  Theme (wallust generated)     │
# │  DO NOT EDIT — edit the template at      │
# │  wallust/templates/hyprland.conf         │
# └──────────────────────────────────────────┘

$bg       = rgb({{color0 | strip}})
$fg       = rgb(e0e0e0)
$accent   = rgb({{color4 | strip}})
$accent2  = rgb({{color5 | strip}})
$warn     = rgb({{color3 | strip}})
$err      = rgb({{color1 | strip}})
$surface  = rgb({{color0 | strip}})
$overlay  = rgb({{color8 | strip}})
$subtle   = rgb({{color7 | strip}})
$muted    = rgb({{color8 | strip}})

general {
    col.active_border = $accent $accent2 45deg
    col.inactive_border = $muted
}

decoration {
    shadow {
        color = rgba({{background | strip}}88)
    }
}
