# ┌──────────────────────────────────────────┐
# │  Hyprlock (wallust generated)  │
# │  DO NOT EDIT — edit the template at      │
# │  wallust/templates/hyprlock.conf         │
# └──────────────────────────────────────────┘

background {
    path = screenshot
    blur_passes = 3
    blur_size = 6
}

input-field {
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb({{color4 | strip}})
    inner_color = rgb({{color0 | strip}})
    font_color = rgb({{foreground | strip}})
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 8
    position = 0, -50
    halign = center
    valign = center
}

label {
    text = $TIME
    color = rgb({{foreground | strip}})
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    text = cmd[update:3600000] date +"%A, %B %d"
    color = rgb({{color8 | strip}})
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
