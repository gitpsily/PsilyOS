max-visible=3
sort=-time
layer=overlay
anchor=top-right
default-timeout=5000

font=JetBrainsMono Nerd Font 11
width=320
height=120
margin=8
padding=12
border-size=2
border-radius=8

background-color={{color0}}dd
text-color={{foreground}}
border-color={{color4}}

[urgency=low]
border-color={{color8}}

[urgency=high]
border-color={{color1}}
default-timeout=0
